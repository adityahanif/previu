name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # `npx tauri` skips scripts/tauri.mjs, whose cargo-home and temp
      # redirection exists for a small system drive and would defeat the cache
      # above. The runner has the MSVC toolchain, so no MinGW is needed.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri

      - name: Build installer and draft the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Previu ${{ github.ref_name }}
          releaseBody: |
            Windows 10/11 installer for ${{ github.ref_name }}.

            The build is unsigned, so SmartScreen may stop it with "Windows
            protected your PC": choose **More info -> Run anyway**.
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: previu-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
